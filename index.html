<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTA Med | Recuperación de Investigación Primaria</title>
    <style>
        /* Estilos básicos para que se vea institucional y profesional */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f8; 
            color: #2c3e50; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            text-align: center; 
        }
        .contenedor { 
            max-width: 900px; 
            padding: 50px 40px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            width: 90%;
        }
        h1 { 
            color: #1a252f; 
            font-size: 3em; 
            margin-bottom: 5px; 
            letter-spacing: -1px;
        }
        h2 { 
            color: #7f8c8d; 
            font-size: 1.3em; 
            font-weight: 400; 
            margin-top: 0; 
            line-height: 1.4;
        }
        .aforismo { 
            font-style: italic; 
            color: #34495e; 
            margin: 25px 0 40px 0; 
            font-size: 1.15em; 
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .caja-busqueda { 
            display: flex; 
            margin-top: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 18px 20px; 
            font-size: 1.1em; 
            border: 1px solid #dcdde1; 
            border-radius: 8px 0 0 8px; 
            outline: none; 
            transition: border 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button { 
            padding: 18px 40px; 
            font-size: 1.1em; 
            font-weight: bold;
            background-color: #2980b9; 
            color: white; 
            border: none; 
            border-radius: 0 8px 8px 0; 
            cursor: pointer; 
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #1c5980; 
        }
        .pie-pagina {
            margin-top: 40px; 
            font-size: 0.9em; 
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>SCRIPTA Med</h1>
        <h2>Sistema Colaborativo para la Recuperación de Investigación Primaria<br>y Trabajos Académicos en Medicina</h2>
        
        <p class="aforismo">"Verba volant, scripta manent"</p>
        
        <!-- Esta es la barra visual. Luego la conectaremos a Zenodo -->
        <div class="caja-busqueda">
            <input type="text" placeholder="Buscar congresos, autores, patologías o tesis...">
            <button>Buscar</button>
        </div>
        
        <p class="pie-pagina">Infraestructura abierta conectada a la API de Zenodo (CERN) para combatir el sesgo de publicación.</p>
    </div>

</body>
</html>
